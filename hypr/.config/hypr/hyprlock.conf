# Hyprlock Config - Cyberpunk Scarlet

# ===== GENERAL =====
general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
}

# ===== BACKGROUND =====
background {
    monitor =
    path = ~/Pictures/Wallpapers/image.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ===== INPUT FIELD =====
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    
    outer_color = rgba(ff0055aa)
    inner_color = rgba(1e050f99)
    font_color = rgb(ff3270)
    
    fade_on_empty = false
    fade_timeout = 1000
    
    placeholder_text = <span foreground="##ff8ba8">Digite a senha...</span>
    
    hide_input = false
    rounding = 8
    
    check_color = rgba(00ffc8aa)
    fail_color = rgba(ff3270aa)
    fail_text = <span foreground="##ff3270">Senha incorreta!</span>
    
    capslock_color = rgba(fffc58aa)
    numlock_color = -1
    bothlock_color = -1
    
    position = 0, -120
    halign = center
    valign = center
}

# ===== TIME =====
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ff0055ff)
    font_size = 90
    font_family = JetBrainsMono Nerd Font ExtraBold
    
    position = 0, 200
    halign = center
    valign = center
}

# ===== DATE =====
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(ff8ba8ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 100
    halign = center
    valign = center
}

# ===== USER =====
label {
    monitor =
    text = $USER
    color = rgba(00ffc8ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    
    position = 0, -200
    halign = center
    valign = center
}

# ===== UPTIME =====
label {
    monitor =
    text = cmd[update:60000] echo "<span foreground='##be4e74'>⏱ $(uptime -p | sed 's/up //')</span>"
    color = rgba(be4e74ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 30
    halign = center
    valign = bottom
}
