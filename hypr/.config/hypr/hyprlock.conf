# ===== GENERAL =====
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
}

# ===== BACKGROUND =====
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.05
    contrast = 0.7
    brightness = 0.3
    vibrancy = 0.1
    vibrancy_darkness = 0.5
}

# ===== INPUT FIELD (Terminal Style) =====
input-field {
    monitor =
    size = 400, 40
    outline_thickness = 1
    dots_size = 0.0
    dots_spacing = 0.0
    dots_center = false
    dots_rounding = 0
    
    outer_color = rgba(ff005588)
    inner_color = rgba(060608cc)
    font_color = rgb(00ffc8)
    
    fade_on_empty = false
    fade_timeout = 1000
    
    placeholder_text = <span foreground="##00ffc8" font_family="JetBrainsMono Nerd Font">root@localhost ~ $ _</span>
    
    hide_input = false
    rounding = 0
    
    check_color = rgba(00ffc888)
    fail_color = rgba(ff327088)
    fail_text = <span foreground="##ff3270">ACCESS DENIED</span>
    
    capslock_color = rgba(d57bff88)
    numlock_color = -1
    bothlock_color = -1
    
    position = 0, -50
    halign = center
    valign = center
}

# ===== TIME (Digital Clock) =====
label {
    monitor =
    text = cmd[update:1000] echo "[ $(date +'%H:%M:%S') ]"
    color = rgba(00ffc8ff)
    font_size = 48
    font_family = JetBrainsMono Nerd Font ExtraBold
    
    position = 0, 160
    halign = center
    valign = center
}

# ===== DATE =====
label {
    monitor =
    text = cmd[update:60000] echo "// $(date +'%Y.%m.%d') - $(date +'%A' | tr '[:lower:]' '[:upper:]')"
    color = rgba(d57bffff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 100
    halign = center
    valign = center
}

# ===== SYSTEM INFO BOX =====
label {
    monitor =
    text = cmd[update:1000] echo "SYSTEM: $(uname -s) $(uname -r | cut -d'-' -f1)"
    color = rgba(be4e74ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "HOST: Norway"
    color = rgba(be4e74ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 34
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "UPTIME: $(uptime -p | sed 's/up //')"
    color = rgba(be4e74ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 18
    halign = center
    valign = center
}

# ===== USER PROMPT =====
label {
    monitor =
    text = cmd[update:0] echo ">> $USER @ Norway"
    color = rgba(ff5680ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    
    position = 0, -120
    halign = center
    valign = center
}

# ===== AUTHENTICATION REQUIRED =====
label {
    monitor =
    text = ⚠ AUTHENTICATION REQUIRED
    color = rgba(ff0055ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Bold
    
    position = 0, -150
    halign = center
    valign = center
}

# ===== BOTTOM STATUS BAR =====
label {
    monitor =
    text = cmd[update:1000] echo "󰌾 LOCKED │ 󰍛 CPU: $(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'.' -f1)% │ 󰘚 MEM: $(free | grep Mem | awk '{printf("%.0f", $3/$2 * 100)}')% │  $(date +'%Z %:z')"
    color = rgba(be4e74ff)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 35
    halign = center
    valign = bottom
}

