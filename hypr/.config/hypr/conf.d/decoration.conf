decoration {
    rounding = 3
    rounding_power = 3

    active_opacity = 1.0
    inactive_opacity = 0.5

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = $primary_alpha
    }

    blur {
        enabled = true
        size = 4
        passes = 1
        vibrancy = 0.1696
    }
    
    dim_inactive = true
    dim_strength = 0.7
}